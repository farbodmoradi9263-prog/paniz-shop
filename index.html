<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شیرینی پانیز | کیک، شیرینی و دسر</title>
<meta name="description" content="فروشگاه آنلاین شیرینی پانیز؛ مشاهده محصولات و ثبت سفارش در واتساپ">

<style>
:root{
--bg:#090706;
--panel:#15100d;
--gold:#e8bd62;
--gold2:#fff0b0;
--muted:#b8aea4;
--line:#5e4520
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
margin:0;
background:var(--bg);
color:#fff;
font-family:Tahoma,Arial,sans-serif;
line-height:1.8
}

a{
text-decoration:none;
color:inherit
}

button,input,select,textarea{
font:inherit
}

.container{
width:min(1180px,92%);
margin:auto
}

header{
position:sticky;
top:0;
z-index:50;
background:#090706ef;
border-bottom:1px solid #a87b2b55;
backdrop-filter:blur(16px)
}

.nav{
height:72px;
display:flex;
align-items:center;
justify-content:space-between;
gap:18px
}

.logo{
font-size:25px;
font-weight:900;
color:var(--gold)
}

.logo small{
display:block;
font-size:9px;
letter-spacing:2px;
color:#a89e95
}

nav{
display:flex;
gap:22px;
color:#ddd
}

nav a:hover{
color:var(--gold)
}

.actions{
display:flex;
gap:8px;
align-items:center
}

.iconbtn,.btn{
border:1px solid #a97b2e55;
border-radius:14px;
padding:11px 16px;
cursor:pointer;
font-weight:900
}

.iconbtn{
background:#17110d;
color:#fff;
position:relative
}

.badge{
position:absolute;
top:-8px;
left:-7px;
background:#dba83f;
color:#17100a;
border-radius:99px;
min-width:22px;
height:22px;
font-size:12px;
display:grid;
place-items:center
}

.btn{
background:linear-gradient(135deg,#ffe39a,#b67a22);
color:#160f08;
border:0
}

.btn:hover{
filter:brightness(1.08)
}

.hero{
min-height:650px;
display:grid;
place-items:center;
position:relative;
overflow:hidden;
background:#120c08
}

.hero:before{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(
90deg,
rgba(5,3,2,.88),
rgba(10,6,3,.25),
rgba(5,3,2,.88)
),
url("https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=2200&q=90")
center/cover no-repeat;
filter:saturate(1.05)
}

.hero:after{
content:"";
position:absolute;
inset:0;
background:
radial-gradient(
circle at 50% 45%,
transparent 0,
rgba(0,0,0,.18) 35%,
rgba(0,0,0,.62) 100%
)
}

.hero-content{
position:relative;
z-index:2;
text-align:center;
max-width:850px;
padding:80px 0
}

.eyebrow{
color:var(--gold);
font-weight:900;
letter-spacing:1px
}

.hero h1{
font-size:clamp(40px,7vw,82px);
line-height:1.15;
margin:15px 0;
background:
linear-gradient(
90deg,
#fff5c9,
#dcae51,
#fff0b0
);
-webkit-background-clip:text;
color:transparent
}

.hero p{
font-size:19px;
color:#eee;
max-width:650px;
margin:0 auto 25px
}

.hero-buttons{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap
}

.section{
padding:78px 0
}

.title{
text-align:center;
margin-bottom:35px
}

.title h2{
font-size:34px;
color:var(--gold2);
margin:0 0 5px
}

.title p{
color:var(--muted);
margin:0
}

.controls{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
margin-bottom:30px
}

input,select,textarea{
background:#120e0b;
color:#fff;
border:1px solid var(--line);
border-radius:12px;
padding:12px 14px;
outline:none
}

input:focus,select:focus,textarea:focus{
border-color:var(--gold)
}

.search{
width:min(420px,100%)
}

.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px
}

.card{
background:
linear-gradient(
180deg,
#1a130e,
#110d0a
);
border:1px solid #624a25;
border-radius:22px;
overflow:hidden;
box-shadow:0 18px 45px #0008;
transition:.25s
}

.card:hover{
transform:translateY(-5px);
border-color:#c49643
}

.card img{
width:100%;
height:215px;
object-fit:cover;
display:block
}

.card-body{
padding:17px
}

.tag{
display:inline-block;
font-size:11px;
color:#e9c879;
background:#3a2915;
border:1px solid #725324;
border-radius:99px;
padding:2px 9px
}

.card h3{
margin:9px 0 2px;
font-size:18px
}

.desc{
color:#a9a09a;
font-size:13px;
min-height:42px
}

.price{
font-size:19px;
color:var(--gold);
font-weight:900;
margin:10px 0
}

.card .btn{
width:100%
}

.features{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px
}

.feature{
padding:24px;
background:#14100d;
border:1px solid #4d391f;
border-radius:18px;
text-align:center
}

.feature b{
color:var(--gold);
font-size:18px
}

.contact{
background:
linear-gradient(
180deg,
#15100c,
#0d0907
);
border-top:1px solid #513b20;
border-bottom:1px solid #513b20;
text-align:center
}

.phone{
font-size:31px;
color:var(--gold);
font-weight:900;
direction:ltr;
display:inline-block
}

footer{
text-align:center;
color:#887e76;
padding:28px
}

.cart-overlay{
position:fixed;
inset:0;
background:#0009;
z-index:80;
display:none
}

.cart-overlay.open{
display:block
}

.cart{
position:absolute;
top:0;
right:0;
height:100%;
width:min(430px,94vw);
background:#110d0a;
border-left:1px solid #745424;
box-shadow:-20px 0 60px #000;
display:flex;
flex-direction:column
}

.cart-head{
padding:18px;
border-bottom:1px solid #4e391f;
display:flex;
justify-content:space-between;
align-items:center
}

.cart-items{
padding:15px;
overflow:auto;
flex:1
}

.cart-item{
display:grid;
grid-template-columns:70px 1fr auto;
gap:10px;
padding:12px 0;
border-bottom:1px solid #332719
}

.cart-item img{
width:70px;
height:65px;
object-fit:cover;
border-radius:10px
}

.qty{
display:flex;
gap:7px;
align-items:center;
margin-top:6px
}

.qty button{
background:#241a12;
color:#fff;
border:1px solid #5b4424;
border-radius:8px;
width:28px;
height:28px;
cursor:pointer
}

.cart-foot{
padding:17px;
border-top:1px solid #4e391f
}

.total{
display:flex;
justify-content:space-between;
font-size:19px;
margin-bottom:12px;
color:var(--gold)
}

.modal{
position:fixed;
inset:0;
background:#000b;
z-index:100;
display:none;
place-items:center;
padding:15px
}

.modal.open{
display:grid
}

.modal-box{
width:min(560px,100%);
max-height:92vh;
overflow:auto;
background:#130e0b;
border:1px solid #765728;
border-radius:22px;
padding:22px;
box-shadow:0 25px 90px #000
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.form-grid .full{
grid-column:1/-1
}

.close{
background:#251b14;
color:#fff;
border:1px solid #5b4424;
border-radius:10px;
padding:7px 12px;
cursor:pointer
}

.notice{
font-size:12px;
color:#a99f96;
margin-top:8px
}

@media(max-width:950px){

.products{
grid-template-columns:repeat(2,1fr)
}

.features{
grid-template-columns:1fr
}

}

@media(max-width:600px){

nav{
display:none
}

.nav{
height:64px
}

.products{
grid-template-columns:1fr
}

.hero{
min-height:570px
}

.hero-content{
padding:60px 0
}

.hero h1{
font-size:45px
}

.form-grid{
grid-template-columns:1fr
}

.form-grid .full{
grid-column:auto
}

}
</style>
</head>

<body>

<div class="container nav">

<a class="logo" href="#">
پانیز

</a>

</nav>

</div>

</header>

<section class="hero">

<div class="hero-content container">

<div class="eyebrow">
شیرینی پانیز
</div>

<h1>
شیرینی تازه، برای لحظه‌های ماندگار
</h1>

<p>
کیک، شیرینی و دسر با ظاهر لوکس و امکان ثبت سفارش مستقیم از سایت.
</p>

<div class="hero-buttons">

<a class="btn" href="#products">
مشاهده محصولات
</a>

</a>

</div>

</div>

</section>

</div>

<div class="controls">

>

<select id="cat">

</div>
